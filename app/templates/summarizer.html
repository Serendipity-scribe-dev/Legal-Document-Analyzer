{% extends "base.html" %}

{% block navbar_title %}Text Summarizer{% endblock %}

{% block title %}Text Summarizer | LegalDoc Analyzer{% endblock %}

{% block content %}
<div class="summarizer-container">
    <h2 class="mb-4">Text Summarizer</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <textarea class="form-control" name="text" rows="10" placeholder="Enter or upload text">{{ input_text }}</textarea>
        </div>
        
        <div class="mb-3">
            <input type="file" class="form-control" name="file" accept=".txt" id="file-upload">
        </div>
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Summarize</button>
            <button type="submit" name="clear" class="btn btn-outline-secondary">Clear</button>
        </div>
    </form>

    {% if summary %}
    <div class="mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Summary:</h3>
            <button onclick="exportSummaryToPDF()" class="btn btn-danger">
                <i class="bi bi-file-earmark-pdf"></i> Export to PDF
            </button>
        </div>
        <div class="p-3 bg-light rounded" id="summary-content">
            <p class="mb-0">{{ summary }}</p>
        </div>
    </div>
    {% endif %}
</div>

<!-- Add these right before closing the content block -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// PDF Export Functionality for Summarizer
function exportSummaryToPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    const content = document.getElementById("summary-content");
    let y = 20; // Start position
    
    // Add title
    pdf.setFontSize(18);
    pdf.setFont("helvetica", "bold");
    pdf.text("Document Summary", 105, 15, { align: 'center' });
    
    // Add metadata
    pdf.setFontSize(10);
    pdf.setFont("helvetica", "normal");
    const today = new Date().toLocaleDateString();
    pdf.text(`Generated by LegalDoc Analyzer on ${today}`, 105, 25, { align: 'center' });
    
    y = 35; // Reset position after header
    
    // Get the summary text
    const summaryText = content.innerText;
    
    if (!summaryText) {
        pdf.text("No summary content to export", 10, y);
        pdf.save("document_summary.pdf");
        return;
    }
    
    // Format and add summary content
    pdf.setFontSize(12);
    pdf.setFont("helvetica", "normal");
    
    const lines = pdf.splitTextToSize(summaryText, 180);
    
    lines.forEach(line => {
        if (y > 280) {
            pdf.addPage();
            y = 20;
        }
        pdf.text(line, 15, y);
        y += 7;
    });
    
    pdf.save("document_summary.pdf");
}
</script>

<style>
.btn-danger {
    background-color: #dc3545;
    transition: all 0.3s;
}
.btn-danger:hover {
    background-color: #bb2d3b;
    transform: translateY(-2px);
}
.summarizer-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}
</style>
{% endblock %}
