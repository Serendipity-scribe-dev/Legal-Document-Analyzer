{% extends "base.html" %}

{% block navbar_title %}ChatBot{% endblock %}

{% block title %}Chatbot{% endblock %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block content %}
        <div class="chat-container">
            <h4 class="text-center">Mistral Chatbot</h4>
            <div id="chat-box"></div>
            <div class="input-group mt-3">
                <input id="user-input" class="form-control" placeholder="Ask something..." />
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
    <style>
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .message {
            margin: 10px 0;
        }
        .user {
            text-align: right;
        }
        .bot {
            text-align: left;
        }
    </style>
</head>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userMessage = input.value;
            input.value = "";

            chatBox.innerHTML += `<div class="message user"><strong>You:</strong> ${userMessage}</div>`;

            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userMessage })
            });

            const data = await res.json();
            chatBox.innerHTML += `<div class="message bot"><strong>Bot:</strong> ${data.response}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            console.log(data); // for debugging

        }
    </script>
{% endblock %}
